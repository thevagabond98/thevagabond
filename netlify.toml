# Netlify configuration for The Vagabond

[build]
  publish = "."
  command = "node generate-index.js"

[build.environment]
  NODE_VERSION = "18"

# Clean URLs
[[redirects]]
  from = "/stories"
  to   = "/stories/"
  status = 301

[[redirects]]
  from = "/poems"
  to   = "/poems/"
  status = 301

[[redirects]]
  from = "/ideas"
  to   = "/ideas/"
  status = 301

# Security headers — applied to all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content-Security-Policy
    # - script-src: self + Netlify Identity widget + Decap CMS (jsdelivr). DOMPurify is now self-hosted.
    # - connect-src: self + Netlify API (Identity & Git Gateway); blob: for CMS image uploads
    # - style-src / font-src: Google Fonts (style.css imports EB Garamond, Cormorant, Inter)
    # - img-src: self + data/blob URIs (CMS draft image previews) + any https image
    # - frame-src: Netlify Identity OAuth popup
    # - object-src: none, frame-ancestors: none (clickjacking protection)
    # NOTE: 'unsafe-inline' / 'unsafe-eval' are kept because the Decap CMS admin and the
    #       inline Netlify Identity snippet need them.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://api.netlify.com https://cdn.jsdelivr.net; connect-src 'self' blob: https://api.netlify.com https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; frame-src https://identity.netlify.com; object-src 'none'; frame-ancestors 'none';"
