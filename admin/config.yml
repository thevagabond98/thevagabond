backend:
  name: git-gateway
  branch: main

# Direct publishing (no editorial workflow): saving commits straight to main
publish_mode: simple

# ASCII-only filenames for NEW posts (stops "U2013" appearing in slugs for en dashes)
slug:
  encoding: "ascii"
  clean_accents: true

media_folder: "/assets/images"
public_folder: "/assets/images"

collections:
  - name: "stories"
    label: "Stories"
    folder: "content/stories"
    create: true
    slug: "{{slug}}"
    media_folder: "/assets/images"
    public_folder: "/assets/images"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "poems"
    label: "Poems"
    folder: "content/poems"
    create: true
    slug: "{{slug}}"
    media_folder: "/assets/images"
    public_folder: "/assets/images"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "ideas"
    label: "Ideas"
    folder: "content/ideas"
    create: true
    slug: "{{slug}}"
    media_folder: "/assets/images"
    public_folder: "/assets/images"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
